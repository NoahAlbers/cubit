name: tonic-local

services:
  mysql:
    image: mysql:8.0.19
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: TonicLocalDev
      MYSQL_USER: tonic_local
      MYSQL_PASSWORD: local-database-only
    volumes:
      - local-mysql:/var/lib/mysql
    networks:
      - isolated
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=local-database-only mysql -h 127.0.0.1 -u tonic_local -D TonicLocalDev -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: ./TonicServices
      dockerfile: Dockerfile.dev
    environment:
      LOCAL_DEVELOPMENT: "true"
      DATABASE_URI: mysql
      DATABASE_NAME: TonicLocalDev
      DATABASE_USERNAME: tonic_local
      DATABASE_PASSWORD: local-database-only
      JWT_SECRET: local-development-signing-key-never-use-in-production
      HOST: 0.0.0.0
      PORT: "5001"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./TonicServices/src:/app/src
      - ./TonicServices/tonic:/app/tonic:ro
    networks:
      - isolated
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Only this proxy publishes a port. The application and DB have no internet route.
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:5001:80"
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - isolated
      - browser

volumes:
  local-mysql:

networks:
  isolated:
    internal: true
  browser:
