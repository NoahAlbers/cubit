<div class="cubit-dialog" [appDraft]="transactionForm.dirty"><h2 mat-dialog-title>{{data.id === 'New' ? 'Add billing entry' : 'Edit billing entry'}}</h2>
  <form [formGroup]="transactionForm" (ngSubmit)="Save()">
    <div class="form-grid"><label>Type<select formControlName="kind"><option value="payment">Payment</option><option value="charge" *ngIf="data.id==='New'">One-time charge</option><option value="refund">Refund</option></select></label><label>Date<input type="date" formControlName="transactionDate" [max]="today" required></label><label>Amount<input type="number" step="0.01" [min]="data.id==='New'?0.01:0" max="99999999" formControlName="amount" required></label><label *ngIf="kind!=='charge'">Method<select formControlName="method"><option value="">Choose method</option><option *ngFor="let method of methods" [value]="method">{{method}}</option></select></label></div>
    <label *ngIf="kind==='charge' || kind==='refund'">{{kind==='charge'?'Description':'Refund reason'}}<input formControlName="description" required maxlength="255"></label>
    <p *ngIf="kind==='refund'" class="muted">Record a refund that has already been issued.</p>
    <details *ngIf="kind!=='charge'"><summary>More details</summary><label *ngIf="kind==='payment'">Description<input formControlName="description" maxlength="255"></label><label>Confirmation number<input formControlName="confirmation" maxlength="255"></label></details>
    <ng-container *ngIf="data.id!=='New'"><button type="button" class="quiet" (click)="transactionForm.controls.amount.setValue(0)" [disabled]="busy">Remove this entry</button><label>Reason for change<input formControlName="correctionReason" required maxlength="255"></label><p class="muted" *ngIf="transactionForm.value.amount===0">This removes the entry from billing and keeps a record in change history.</p></ng-container>
    <p *ngIf="error" class="error" role="alert">{{error}}</p><p class="muted" *ngIf="transactionForm.invalid">Complete the required fields and correct any invalid values to save.</p><div class="actions"><button class="secondary" type="button" (click)="onCancel()" [disabled]="busy">Cancel</button><button class="primary" type="submit" [disabled]="busy || loading || transactionForm.invalid">{{data.id==='New'?'Add entry':'Save change'}}</button></div>
  </form>
</div>
