<div [class.mat-elevation-z2]="!LowElevation" class="card">
  <div style="height: 5px" class="bgdark"></div>
  <div class="bgprimary headerspan">
    <ng-content select=".headerText"></ng-content>
    <div class="header-actions">
      <div class="cardButtonContainer">
        <div class="cardButtons">
          @if (addClick.observers.length > 0) {
            <button
              mat-mini-fab
              (click)="add($event)"
              >
              <mat-icon aria-label="Add">add</mat-icon>
            </button>
          }
          <ng-content select=".extraButtons"></ng-content>
        </div>
      </div>
    </div>
  </div>
  <div class="bggray card-subheader">
    <div class="headerdiv">
      <div class="subHeaderText">
        <ng-content select=".subHeaderText"></ng-content>
      </div>
    </div>
  </div>
  <div style="min-height: 150px" class="bglightgray cardcontent">
    <ng-content select=".content"></ng-content>
  </div>
</div>
