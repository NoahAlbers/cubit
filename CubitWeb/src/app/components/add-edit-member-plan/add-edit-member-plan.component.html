<div class="cubit-dialog" [appDraft]="planForm.dirty"><span class="eyebrow">MEMBERSHIP</span><h2 mat-dialog-title>Add a plan</h2><form [formGroup]="planForm" (ngSubmit)="Save()"><label>Plan<select formControlName="planId" required><option value="">Choose a plan</option>@for (plan of plans | async; track plan) {
<option [value]="plan.id">{{plan.name}} · {{plan.monthlyCost | currency}} / month</option>
}</select></label><label>Start date<input type="date" formControlName="startDate" required></label><p class="muted">The first charge is due on this date. To cancel later, use End billing on the member profile.</p>@if (error) {
<p class="error" role="alert">{{error}}</p>
}@if (planForm.invalid) {
<p class="muted">Complete the required fields and correct any invalid values to save.</p>
}<div class="actions"><button class="secondary" type="button" (click)="onCancel()">Cancel</button><button class="primary" type="submit" [disabled]="planForm.invalid">Save plan</button></div></form></div>
