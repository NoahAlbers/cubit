<div class="cubit-dialog" [appDraft]="planForm.dirty"><span class="eyebrow">MEMBERSHIP</span><h2 mat-dialog-title>Add a plan</h2><form [formGroup]="planForm" (ngSubmit)="Save()"><label>Plan<select formControlName="planId" required><option value="">Choose a plan</option><option *ngFor="let plan of plans | async" [value]="plan.id">{{plan.name}} · {{plan.monthlyCost | currency}} / month</option></select></label><label>Start date<input type="date" formControlName="startDate" required></label><p class="muted">The first charge is due on this date. To cancel later, use End billing on the member profile.</p><p *ngIf="error" class="error" role="alert">{{error}}</p><p class="muted" *ngIf="planForm.invalid">Complete the required fields and correct any invalid values to save.</p><div class="actions"><button class="secondary" type="button" (click)="onCancel()">Cancel</button><button class="primary" type="submit" [disabled]="planForm.invalid">Save plan</button></div></form></div>
