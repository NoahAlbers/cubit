<div class="cubit-dialog" [appDraft]="keyForm.dirty"><span class="eyebrow">MEMBER ACCESS</span><h2 mat-dialog-title>Add an access key</h2><form [formGroup]="keyForm" (ngSubmit)="Save()"><label>Key serial number<input formControlName="serialNumber" required></label><p class="error" *ngIf="error" role="alert">{{error}}</p><p class="muted" *ngIf="keyForm.invalid">Complete the required fields and correct any invalid values to save.</p><div class="actions"><button class="secondary" type="button" (click)="onCancel()">Cancel</button><button class="primary" type="submit" [disabled]="keyForm.invalid">Save key</button></div></form></div>
