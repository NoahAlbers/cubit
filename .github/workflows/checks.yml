name: Check Cubit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: cubit_demo
          MYSQL_USER: cubit_demo
          MYSQL_PASSWORD: ci-demo-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n deploy/update-review.sh
      - run: bash -n deploy/install-build-node.sh
      - run: bash -n deploy/migrate-billing-tools.sh
      - run: python3 deploy/test-backups.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - run: npm install --global pnpm@9.15.9
      - run: pnpm --dir CubitServices install --frozen-lockfile
      - run: pnpm --dir CubitWeb install --frozen-lockfile
      - run: pnpm --dir CubitServices audit --prod --audit-level=high
      - run: pnpm --dir CubitWeb audit --prod --audit-level=high
      - run: node dev/build-web.cjs
      - run: pnpm --dir CubitWeb test
      - run: pnpm --dir CubitWeb exec playwright install --with-deps chromium
      - run: node dev/verify-login.cjs
      - run: pnpm --dir CubitServices build
      - run: node tests/security-hardening.cjs
        working-directory: CubitServices
      - run: node tests/remembered-greeting.cjs && node tests/login-greeting-integration.cjs
        working-directory: CubitServices
      - run: node tests/backup-settings.cjs && node tests/contact-validation.cjs && node tests/local-safety.cjs && node tests/hosted-safety.cjs && node tests/hosted-demo.cjs && node tests/billing.cjs && node tests/activity-patterns.cjs && node tests/review-controls.cjs
        working-directory: CubitServices
      - run: node tests/migration-baseline.cjs
        working-directory: CubitServices
        env:
          CUBIT_MIGRATION_TEST: disposable
          CUBIT_MODE: hosted-demo
          LOCAL_DEVELOPMENT: 'false'
          HOST: 127.0.0.1
          PORT: '5002'
          DATABASE_URI: 127.0.0.1
          DATABASE_NAME: cubit_demo
          DATABASE_USERNAME: cubit_demo
          DATABASE_PASSWORD: ci-demo-only
          JWT_SECRET: ci-disposable-demo-signing-key-not-a-runtime-secret-2026
      - run: node tests/billing-tools-db.cjs
        working-directory: CubitServices
        env:
          CUBIT_TEST_EMPTY_DATABASE: 'yes'
          CUBIT_BROWSER_TESTS: 'yes'
          CUBIT_MODE: hosted-demo
          LOCAL_DEVELOPMENT: 'false'
          HOST: 127.0.0.1
          PORT: '5002'
          DATABASE_URI: 127.0.0.1
          DATABASE_NAME: cubit_demo
          DATABASE_USERNAME: cubit_demo
          DATABASE_PASSWORD: ci-demo-only
          JWT_SECRET: ci-disposable-demo-signing-key-not-a-runtime-secret-2026
