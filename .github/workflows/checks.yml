name: Check Cubit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/update-review.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@9.15.9
      - run: pnpm --dir CubitServices install --frozen-lockfile
      - run: pnpm --dir CubitWeb install --frozen-lockfile
      - run: node dev/build-web.cjs
      - run: pnpm --dir CubitServices build
      - run: node tests/local-safety.cjs && node tests/hosted-safety.cjs && node tests/hosted-demo.cjs && node tests/billing.cjs && node tests/activity-patterns.cjs && node tests/review-controls.cjs
        working-directory: CubitServices
