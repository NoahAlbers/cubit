version: 2
updates:
  - package-ecosystem: npm
    directory: /CubitServices
    # Match the deployed Node runtime and ts-node's supported compiler API.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /CubitWeb
    # Angular 22 requires TypeScript 6.0; Node types match the build runtime.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
